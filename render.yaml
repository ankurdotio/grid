services:
  - type: keyvalue
    name: shared-grid-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: shared-grid
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/grid
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: shared-grid-redis
          property: connectionString
