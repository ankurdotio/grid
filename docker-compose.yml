services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  server:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - redis
